server:
  port: ${SERVER_PORT:8080}

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/subs}
    username: ${SPRING_DATASOURCE_USERNAME:subs}
    password: ${SPRING_DATASOURCE_PASSWORD:subs}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /swagger.yaml
  swagger-ui:
    path: /swagger-ui.html
