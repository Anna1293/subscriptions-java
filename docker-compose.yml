services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subs
      POSTGRES_PASSWORD: subs
      POSTGRES_DB: subs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subs -d subs"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/subs
      SPRING_DATASOURCE_USERNAME: subs
      SPRING_DATASOURCE_PASSWORD: subs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
